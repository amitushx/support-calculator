<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculator tests</title>
<style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 24px; }
    .pass { color: #15803d; }
    .fail { color: #b91c1c; font-weight: 600; }
</style>
</head>
<body>
<h1 id="summary"></h1>
<ol id="results"></ol>
<script src="../js/lib/arith.js"></script>
<script>
// [expression as typed, expected value]
const CASES = [
    ['', null],
    ['-', null],
    ['7', 7],
    ['2+3', 5],
    ['2+3*4', 14],         // × before +
    ['10-4-3', 3],
    ['8/2/2', 2],
    ['2*3/4', 1.5],
    ['0.1+0.2', 0.3],      // no floating-point noise
    ['1.1*3', 3.3],
    ['1/3', 0.333],        // 3 digits after the point
    ['2/3', 0.667],
    ['-2/3', -0.667],
    ['1.0005*1', 1.001],   // half rounds away from zero, despite the float
    ['-1.0005*1', -1.001],
    ['0.0004*1', 0],
    ['-0.0004*1', 0],      // not -0
    ['12.3456+0', 12.346],
    ['1000000*1000000', 1000000000000],
    ['145.9*28%', 40.852],
    ['200+10%', 220],      // adds 10% of 200
    ['200-10%', 180],
    ['50%', 0.5],
    ['100/50%', 200],
    ['2+3*10%', 2.3],      // 10% inside a product is just 0.1
    ['-5+2', -3],
    ['5*-3', -15],
    ['6/-2', -3],
    ['12+', 12],           // a trailing operator is ignored
    ['12*', 12],
    ['.5+.5', 1],
    ['3.', 3],
    ['5-5', 0],
    ['-0*1', 0],
    ['5/0', 'divByZero'],
    ['5/0%', 'divByZero'],
    ['0/5', 0]
];

const results = [];
for (const [expr, expected] of CASES) {
    const got = calculate(expr);
    results.push({ ok: Object.is(got, expected), text: `"${expr}" → ${got} (expected ${expected})` });
}

const failed = results.filter(r => !r.ok).length;
document.getElementById('summary').textContent = failed ? `${failed} of ${results.length} failed` : `All ${results.length} passed`;
document.getElementById('summary').className = failed ? 'fail' : 'pass';
for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = r.text;
    document.getElementById('results').append(li);
}
</script>
</body>
</html>
