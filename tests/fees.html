<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distance fee tests</title>
<style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 24px; }
    .pass { color: #15803d; }
    .fail { color: #b91c1c; font-weight: 600; }
</style>
</head>
<body>
<h1 id="summary"></h1>
<ol id="results"></ol>
<script src="../js/lib/fees.js"></script>
<script>
// [meters, bonus %, walker, expected payment in ILS]
const CASES = [
    // Rider: 3 ILS up to 200m (101-200m), then each started 100m adds its band's
    // rate; the result rounds up. Brackets checked against the original calculator.
    [101, 0, false, 3],
    [200, 0, false, 3],
    [201, 0, false, 4],                // 3.55
    [300, 0, false, 4],
    [301, 0, false, 5],                // 4.10
    [400, 0, false, 5],
    [901, 0, false, 8],                // 7.40
    [1100, 0, false, 8],               // 7.95
    [1101, 0, false, 9],               // 8.30, first 100m of the 0.35 band
    [3100, 0, false, 15],              // 14.95
    [3101, 0, false, 16],              // 15.25, first 100m of the 0.30 band
    [5100, 0, false, 21],              // 20.95
    [5101, 0, false, 22],              // 21.15, first 100m of the 0.20 band
    [9100, 0, false, 29],              // 28.95
    [9101, 0, false, 30],              // 29.15
    [9600, 0, false, 30],              // 29.95
    [10000, 0, false, 31],             // 30.75
    // Rider with bonus
    [200, 100, false, 6],              // exactly 6
    [1100, 10, false, 9],              // 8.745
    [3100, 20, false, 18],             // 17.94
    [1100, 33.3, false, 11],           // 10.597, fractional bonus
    // Walker: 7 ILS up to 100m, +1 ILS per started 50m, capped at 16
    [101, 0, true, 8],
    [150, 0, true, 8],
    [151, 0, true, 9],
    [550, 0, true, 16],
    [551, 0, true, 16],                // cap
    [5000, 0, true, 16],
    // Walker with bonus
    [150, 50, true, 12],               // exactly 12
    [150, 12.5, true, 9],              // exactly 9, fractional bonus
    [101, 1, true, 9],                 // 8.08 rounds up
    [5000, 25, true, 20]               // bonus applies on top of the cap
];

const results = [];
for (const [meters, bonus, walker, expected] of CASES) {
    const got = payment(meters, bonus, walker);
    results.push({
        ok: got === expected,
        text: `${walker ? 'walker' : 'rider'}, ${meters}m, ${bonus}% bonus → ₪${got} (expected ₪${expected})`
    });
}

const failed = results.filter(r => !r.ok).length;
document.getElementById('summary').textContent = failed ? `${failed} of ${results.length} failed` : `All ${results.length} passed`;
document.getElementById('summary').className = failed ? 'fail' : 'pass';
for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = r.text;
    document.getElementById('results').append(li);
}
</script>
</body>
</html>
