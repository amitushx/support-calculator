// Whole-list checks: [list, number of cities, number of slots]
const COUNTS = [
    ['inline', 22, 86],
    ['byHour', 13, 27],
    ['byCity', 21, 78]
];

const results = [];
const check = (ok, text) => results.push({ ok, text });
// The same lists copied from Slack, where emojis become :name: shortcodes;
// every check runs on these too
for (const [list, text] of Object.entries(LISTS)) {
    LISTS[list + 'Slack'] = text.replace(/\p{Extended_Pictographic}️?/gu, ':palm_tree:');
}
for (const rows of [COUNTS, CASES]) {
    rows.push(...rows.map(([list, ...rest]) => [list + 'Slack', ...rest]));
}

const parsed = Object.fromEntries(Object.entries(LISTS).map(([k, v]) => [k, parseBonusList(v)]));

for (const [list, cities, slots] of COUNTS) {
    const got = parsed[list];
    const gotSlots = got.reduce((n, c) => n + c.slots.length, 0);
    check(got.length === cities && gotSlots === slots,
        `${list}: ${got.length}/${cities} cities, ${gotSlots}/${slots} slots — ${got.map(c => c.name).join(', ')}`);
}
for (const [list, name, time, expected] of CASES) {
    const city = parsed[list].find(c => cityKey(c.name) === cityKey(name));
    const [h, m] = time.split(':').map(Number);
    const got = city ? bonusAt(city.slots, h * 60 + m) : 'city not found';
    check(got === expected, `${list}: ${name} at ${time} → ${got} (expected ${expected})`);
}

const failed = results.filter(r => !r.ok).length;
document.getElementById('summary').textContent = failed ? `${failed} of ${results.length} failed` : `All ${results.length} passed`;
document.getElementById('summary').className = failed ? 'fail' : 'pass';
for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = r.text;
    document.getElementById('results').append(li);
}
